name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p build

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/StickmanWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickmanWorld-Android
          path: build/StickmanWorld.apk
          if-no-files-found: error
