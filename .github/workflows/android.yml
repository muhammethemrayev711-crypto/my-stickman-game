name: "Android Build"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Godot Ortamını Kur (Godot sürümüne göre burayı değiştirebilirsin, örn: v3.5.3-stable)
      - name: Setup Godot
        uses: abarichello/godot-ci@v4.3-stable
        
      - name: Create Export Directory
        run: mkdir -p build/android

      # Projeyi Android APK olarak dışa aktar (export_presets.cfg içindeki preset adıyla aynı olmalı)
      - name: Export APK
        run: |
          godot --headless --export-release "Android" build/android/game.apk
          
      # Çıktı olarak oluşan APK dosyasını indirilebilir hale getir
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickman-world-apk
          path: build/android/game.apk
