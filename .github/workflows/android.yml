
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output
        run: mkdir -p StickmanWorld/build

      - name: Import project
        run: godot --headless --editor --path StickmanWorld --quit

      - name: Export APK
        run: godot --headless --path StickmanWorld --export-debug "Android" StickmanWorld/build/StickmanWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickmanWorld-APK
          path: StickmanWorld/build/StickmanWorld.apk
